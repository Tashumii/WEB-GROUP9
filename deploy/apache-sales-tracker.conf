<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com
    DocumentRoot /var/www/sales-tracker/public

    <Directory /var/www/sales-tracker/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Block access to sensitive files even if doc root is misconfigured
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/sales-tracker-error.log
    CustomLog ${APACHE_LOG_DIR}/sales-tracker-access.log combined
</VirtualHost>